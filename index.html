<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Дневник снов</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дневник снов">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root {
      --bg:#1a1a2e; --card:#16213e; --text:#e9ecef; --muted:#aab0c0;
      --accent:#7b61ff; --accent2:#9d8aff; --danger:#ff4d4d; --input:#0f3460;
      --ok:#28a745; --line:#2e4a6d;
    }
    * { box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg); color:var(--text); margin:0;
      padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
              calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      min-height:100vh;
    }
    .container { max-width:720px; margin:0 auto; }
    h1 { text-align:center; font-weight:300; color:var(--accent); margin:10px 0 22px; }
    h2,h3 { margin-top:0; }
    button, input, textarea, select { font:inherit; }
    button { touch-action:manipulation; }
    .btn-main {
      width:100%; padding:18px; font-size:1.16rem; background:var(--accent); color:white;
      border:0; border-radius:15px; font-weight:700; cursor:pointer; margin-bottom:12px;
    }
    .btn-main:active { transform:scale(.99); }
    .toolbar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
    .btn-secondary {
      min-height:44px; background:transparent; border:1px solid var(--accent);
      color:var(--accent2); padding:9px 10px; border-radius:10px; cursor:pointer;
    }
    .controls { display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:14px; }
    input[type="text"], input[type="date"], textarea, select {
      width:100%; padding:12px; background:var(--input); border:1px solid var(--line);
      border-radius:9px; color:white;
    }
    textarea { resize:vertical; min-height:96px; }
    .dream-card {
      background:var(--card); padding:15px; border-radius:12px; margin-bottom:12px;
      border-left:4px solid var(--accent); cursor:pointer;
    }
    .dream-card .date { font-size:.8rem; color:var(--muted); }
    .dream-card h3 { margin:5px 0 7px; font-size:1.08rem; }
    .snippet { color:#c7cad4; font-size:.92rem; line-height:1.4; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .tag { font-size:.75rem; background:#26294b; border:1px solid #444879; border-radius:999px; padding:4px 8px; }
    .empty { text-align:center; color:var(--muted); padding:28px 0; }

    .modal {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:100;
      align-items:center; justify-content:center; padding:10px;
    }
    .modal-content {
      background:var(--card); width:100%; max-width:620px; max-height:92vh; overflow:auto;
      padding:22px; border-radius:20px;
    }
    .form-group { margin-bottom:14px; }
    label { display:block; font-size:.88rem; color:#c9ccda; margin-bottom:5px; }
    .hint { font-size:.76rem; color:var(--muted); margin-top:5px; line-height:1.35; }
    .voice-row { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .voice-btn { flex:1; border:1px solid var(--accent); color:white; background:#2a2750; border-radius:10px; padding:11px; }
    .voice-btn.recording { background:#6d2440; border-color:#ff7b9f; }
    .voice-status { font-size:.78rem; color:var(--muted); min-height:1.2em; margin-top:5px; }
    .modal-actions { display:flex; justify-content:space-between; gap:8px; margin-top:18px; flex-wrap:wrap; }
    .action-right { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
    .btn-save,.btn-delete,.btn-close,.btn-pdf {
      border:0; color:white; padding:10px 15px; border-radius:9px; cursor:pointer; min-height:42px;
    }
    .btn-save { background:var(--ok); }
    .btn-delete { background:var(--danger); }
    .btn-close { background:#6c757d; }
    .btn-pdf { background:#3e4b77; }

    .stats-panel { display:none; background:var(--card); border-radius:14px; padding:16px; margin-bottom:15px; }
    .stats-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .stats-controls { display:grid; grid-template-columns:1fr auto; gap:8px; margin:12px 0; }
    .stat-block { margin-top:14px; }
    .stat-title { color:var(--accent2); font-size:.9rem; margin-bottom:7px; }
    .stat-row { display:grid; grid-template-columns:1fr auto; gap:12px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.07); }
    .muted { color:var(--muted); }

    @media (max-width:560px) {
      .toolbar { grid-template-columns:1fr 1fr; }
      .toolbar .wide { grid-column:1 / -1; }
      .controls { grid-template-columns:1fr; }
      .stats-controls { grid-template-columns:1fr; }
    }

    @media print {
      body { background:white; color:#111; padding:20px; }
      .container > * { display:none !important; }
      #printArea { display:block !important; }
      #printArea h1,#printArea h2 { color:#111; }
      #printArea article { break-inside:avoid; margin-bottom:24px; }
      #printArea .meta { color:#555; font-size:12px; }
      #printArea .field { margin:8px 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Дневник снов</h1>

  <button class="btn-main" onclick="openModal()">✨ Записать сон</button>

  <div class="toolbar">
    <button class="btn-secondary" onclick="toggleStats()">Статистика</button>
    <button class="btn-secondary" onclick="printDiary()">PDF / Печать</button>
    <button class="btn-secondary" onclick="exportDreams()">Резервная копия</button>
    <button class="btn-secondary wide" onclick="document.getElementById('importFile').click()">Восстановить из копии</button>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importDreams(event)">
  </div>

  <section id="statsPanel" class="stats-panel">
    <div class="stats-head">
      <h3 style="margin:0;">Повторяющиеся образы</h3>
      <button class="btn-secondary" onclick="toggleStats()">Закрыть</button>
    </div>
    <div class="stats-controls">
      <select id="statsPeriod" onchange="renderStats()">
        <option value="all">Всё время</option>
        <option value="365">Последний год</option>
        <option value="90">Последние 3 месяца</option>
        <option value="30">Последний месяц</option>
      </select>
      <span id="statsCount" class="muted" style="align-self:center;"></span>
    </div>
    <div id="statsContent"></div>
  </section>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Поиск: мама, вода, поезд…" oninput="renderDreams()">
    <select id="sortOrder" onchange="renderDreams()">
      <option value="desc">Сначала новые</option>
      <option value="asc">Сначала старые</option>
    </select>
  </div>

  <div id="dreamsList"></div>
</div>

<div id="dreamModal" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Новый сон</h2>
    <input type="hidden" id="dreamId">

    <div class="form-group">
      <label for="dreamDate">Дата</label>
      <input type="date" id="dreamDate">
    </div>

    <div class="form-group">
      <label for="dreamName">Название сна</label>
      <input type="text" id="dreamName" placeholder="Короткое название">
    </div>

    <div class="form-group">
      <label for="dreamText">Описание сна</label>
      <textarea id="dreamText" rows="7" placeholder="Запиши всё, что помнишь, даже обрывками…"></textarea>
      <div class="voice-row">
        <button id="voiceBtn" class="voice-btn" type="button" onclick="toggleVoice()">🎙 Надиктовать сон</button>
      </div>
      <div id="voiceStatus" class="voice-status"></div>
    </div>

    <div class="form-group">
      <label for="dreamCharacters">Персонажи</label>
      <input type="text" id="dreamCharacters" placeholder="Например: мама, друг, незнакомый мужчина">
      <div class="hint">Разделяй запятыми.</div>
    </div>

    <div class="form-group">
      <label for="dreamPlaces">Места</label>
      <input type="text" id="dreamPlaces" placeholder="Дом, море, вокзал…">
    </div>

    <div class="form-group">
      <label for="dreamSymbols">Символы / образы</label>
      <input type="text" id="dreamSymbols" placeholder="Вода, поезд, дверь, документы…">
    </div>

    <div class="form-group">
      <label for="dreamEmotions">Эмоции</label>
      <input type="text" id="dreamEmotions" placeholder="Спокойствие, тревога, удивление…">
    </div>

    <div class="form-group">
      <label for="dreamNotes">Дополнительные заметки</label>
      <textarea id="dreamNotes" rows="3" placeholder="Ассоциации, связь с событиями дня, мысли после пробуждения…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-delete" id="deleteBtn" onclick="deleteDream()" style="display:none;">Удалить</button>
      <div class="action-right">
        <button class="btn-pdf" id="singlePdfBtn" onclick="printCurrentDream()" style="display:none;">PDF</button>
        <button class="btn-close" onclick="closeModal()">Отмена</button>
        <button class="btn-save" onclick="saveDream()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea" style="display:none;"></div>

<script>
  let dreams = safeLoadDreams();
  let recognition = null;
  let isListening = false;
  let voiceShouldRun = false;
  let voiceRestartTimer = null;

  function safeLoadDreams() {
    try {
      const parsed = JSON.parse(localStorage.getItem('myDreams') || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function normalizeDream(d) {
    return {
      id: d.id ?? Date.now(),
      date: d.date || new Date().toISOString().slice(0,10),
      title: d.title || 'Без названия',
      text: d.text || '',
      characters: d.characters || '',
      places: d.places || '',
      symbols: d.symbols || '',
      emotions: d.emotions || '',
      notes: d.notes || ''
    };
  }

  dreams = dreams.map(normalizeDream);

  function persist() {
    localStorage.setItem('myDreams', JSON.stringify(dreams));
  }

  function openModal(id = null) {
    stopVoice();
    const modal = document.getElementById('dreamModal');
    const deleteBtn = document.getElementById('deleteBtn');
    const singlePdfBtn = document.getElementById('singlePdfBtn');
    modal.style.display = 'flex';

    if (id !== null) {
      const dream = dreams.find(d => String(d.id) === String(id));
      if (!dream) return;
      document.getElementById('modalTitle').innerText = 'Редактировать сон';
      document.getElementById('dreamId').value = dream.id;
      document.getElementById('dreamDate').value = dream.date;
      document.getElementById('dreamName').value = dream.title;
      document.getElementById('dreamText').value = dream.text;
      document.getElementById('dreamCharacters').value = dream.characters || '';
      document.getElementById('dreamPlaces').value = dream.places || '';
      document.getElementById('dreamSymbols').value = dream.symbols || '';
      document.getElementById('dreamEmotions').value = dream.emotions || '';
      document.getElementById('dreamNotes').value = dream.notes || '';
      deleteBtn.style.display = 'block';
      singlePdfBtn.style.display = 'inline-block';
    } else {
      document.getElementById('modalTitle').innerText = 'Новый сон';
      document.getElementById('dreamId').value = '';
      document.getElementById('dreamDate').value = new Date().toISOString().slice(0,10);
      ['dreamName','dreamText','dreamCharacters','dreamPlaces','dreamSymbols','dreamEmotions','dreamNotes']
        .forEach(id => document.getElementById(id).value = '');
      deleteBtn.style.display = 'none';
      singlePdfBtn.style.display = 'none';
    }
    document.getElementById('voiceStatus').textContent = '';
  }

  function closeModal() {
    stopVoice();
    document.getElementById('dreamModal').style.display = 'none';
  }

  function saveDream() {
    const idRaw = document.getElementById('dreamId').value;
    const dreamData = normalizeDream({
      id: idRaw ? idRaw : Date.now(),
      date: document.getElementById('dreamDate').value,
      title: document.getElementById('dreamName').value.trim() || 'Без названия',
      text: document.getElementById('dreamText').value.trim(),
      characters: document.getElementById('dreamCharacters').value.trim(),
      places: document.getElementById('dreamPlaces').value.trim(),
      symbols: document.getElementById('dreamSymbols').value.trim(),
      emotions: document.getElementById('dreamEmotions').value.trim(),
      notes: document.getElementById('dreamNotes').value.trim()
    });

    if (idRaw) {
      const index = dreams.findIndex(d => String(d.id) === String(idRaw));
      if (index >= 0) dreams[index] = dreamData;
    } else {
      dreams.push(dreamData);
    }

    persist();
    closeModal();
    renderDreams();
    if (document.getElementById('statsPanel').style.display === 'block') renderStats();
  }

  function deleteDream() {
    const id = document.getElementById('dreamId').value;
    if (confirm('Удалить эту запись навсегда?')) {
      dreams = dreams.filter(d => String(d.id) !== String(id));
      persist();
      closeModal();
      renderDreams();
      renderStats();
    }
  }

  function escapeHtml(value='') {
    return String(value)
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'",'&#039;');
  }

  function listTerms(value='') {
    return String(value).split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  }

  function renderDreams() {
    const list = document.getElementById('dreamsList');
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const order = document.getElementById('sortOrder').value;

    const filtered = dreams.filter(d => {
      const haystack = [
        d.title,d.text,d.characters,d.places,d.symbols,d.emotions,d.notes
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    }).sort((a,b) => {
      const diff = new Date(a.date) - new Date(b.date);
      return order === 'desc' ? -diff : diff;
    });

    list.innerHTML = '';
    filtered.forEach(d => {
      const card = document.createElement('div');
      card.className = 'dream-card';
      card.onclick = () => openModal(d.id);
      const tags = [
        ...listTerms(d.characters).slice(0,2),
        ...listTerms(d.symbols).slice(0,3)
      ].slice(0,5);
      card.innerHTML = `
        <div class="date">${formatDate(d.date)}</div>
        <h3>${escapeHtml(d.title)}</h3>
        <div class="snippet">${escapeHtml(d.text.slice(0,120))}${d.text.length > 120 ? '…' : ''}</div>
        ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      `;
      list.appendChild(card);
    });

    if (!filtered.length) list.innerHTML = '<div class="empty">Записей пока нет…</div>';
  }

  function formatDate(date) {
    try { return new Date(date + 'T12:00:00').toLocaleDateString('ru-RU'); }
    catch { return date; }
  }

  // Голос → текст с автоматическим перезапуском.
  // Браузер может сам завершать одну сессию распознавания. Пока пользователь
  // не нажал «Остановить», приложение запускает следующую сессию автоматически.
  function toggleVoice() {
    if (voiceShouldRun) {
      stopVoice();
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      document.getElementById('voiceStatus').textContent =
        'На этом устройстве браузер не предоставляет встроенное распознавание речи. Можно использовать диктовку клавиатуры iPad.';
      return;
    }

    voiceShouldRun = true;
    startVoiceSession(SpeechRecognition);
  }

  function startVoiceSession(SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition) {
    if (!voiceShouldRun || !SpeechRecognition) return;

    clearTimeout(voiceRestartTimer);

    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;

    let finalChunk = '';

    recognition.onstart = () => {
      isListening = true;
      const btn = document.getElementById('voiceBtn');
      btn.classList.add('recording');
      btn.textContent = '⏹ Остановить';
      document.getElementById('voiceStatus').textContent = 'Слушаю… говори свободно.';
    };

    recognition.onresult = event => {
      let interim = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
          finalChunk += chunk + ' ';
        } else {
          interim += chunk;
        }
      }

      if (finalChunk) {
        const field = document.getElementById('dreamText');
        const clean = finalChunk.trim();

        if (clean) {
          const separator = field.value && !/\s$/.test(field.value) ? ' ' : '';
          field.value += separator + clean;
        }

        finalChunk = '';
      }

      document.getElementById('voiceStatus').textContent =
        interim ? 'Слышу: ' + interim : 'Слушаю…';
    };

    recognition.onerror = event => {
      isListening = false;

      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        voiceShouldRun = false;
        document.getElementById('voiceStatus').textContent =
          'Нет доступа к микрофону. Разреши доступ к микрофону в настройках браузера.';
        updateVoiceButton();
        return;
      }

      if (event.error === 'audio-capture') {
        voiceShouldRun = false;
        document.getElementById('voiceStatus').textContent =
          'Микрофон недоступен.';
        updateVoiceButton();
        return;
      }

      document.getElementById('voiceStatus').textContent =
        'Распознавание прервалось. Перезапускаю…';
    };

    recognition.onend = () => {
      isListening = false;

      if (voiceShouldRun) {
        document.getElementById('voiceStatus').textContent =
          'Продолжаю слушать…';
        voiceRestartTimer = setTimeout(() => {
          startVoiceSession(SpeechRecognition);
        }, 350);
      } else {
        updateVoiceButton();
      }
    };

    try {
      recognition.start();
    } catch {
      if (voiceShouldRun) {
        voiceRestartTimer = setTimeout(() => {
          startVoiceSession(SpeechRecognition);
        }, 700);
      }
    }
  }

  function updateVoiceButton() {
    const btn = document.getElementById('voiceBtn');
    if (!btn) return;

    if (voiceShouldRun) {
      btn.classList.add('recording');
      btn.textContent = '⏹ Остановить';
    } else {
      btn.classList.remove('recording');
      btn.textContent = '🎙 Надиктовать сон';
    }
  }

  function stopVoice() {
    voiceShouldRun = false;
    clearTimeout(voiceRestartTimer);

    if (recognition) {
      recognition.onend = null;
      try { recognition.stop(); } catch {}
    }

    recognition = null;
    isListening = false;
    updateVoiceButton();

    const status = document.getElementById('voiceStatus');
    if (status) status.textContent = 'Диктовка остановлена.';
  }

  // Статистика
  function toggleStats() {
    const panel = document.getElementById('statsPanel');
    const willShow = panel.style.display !== 'block';
    panel.style.display = willShow ? 'block' : 'none';
    if (willShow) renderStats();
  }

  function dreamsForStats() {
    const period = document.getElementById('statsPeriod').value;
    if (period === 'all') return dreams;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - Number(period));
    return dreams.filter(d => new Date(d.date + 'T12:00:00') >= cutoff);
  }

  function frequency(items) {
    const map = new Map();
    items.flatMap(listTerms).forEach(raw => {
      const key = raw.toLocaleLowerCase('ru-RU');
      if (!map.has(key)) map.set(key, {label: raw, count:0});
      map.get(key).count++;
    });
    return [...map.values()].sort((a,b) => b.count - a.count || a.label.localeCompare(b.label,'ru'));
  }

  function renderStatBlock(title, rows) {
    if (!rows.length) return '';
    return `<div class="stat-block">
      <div class="stat-title">${title}</div>
      ${rows.slice(0,12).map(r => `<div class="stat-row"><span>${escapeHtml(r.label)}</span><strong>${r.count}</strong></div>`).join('')}
    </div>`;
  }

  function renderStats() {
    const selected = dreamsForStats();
    document.getElementById('statsCount').textContent = `Снов: ${selected.length}`;
    const html =
      renderStatBlock('Символы / образы', frequency(selected.map(d => d.symbols))) +
      renderStatBlock('Персонажи', frequency(selected.map(d => d.characters))) +
      renderStatBlock('Места', frequency(selected.map(d => d.places))) +
      renderStatBlock('Эмоции', frequency(selected.map(d => d.emotions)));
    document.getElementById('statsContent').innerHTML =
      html || '<div class="muted">Пока недостаточно данных для статистики.</div>';
  }

  // Резервная копия JSON
  function exportDreams() {
    const payload = { app:'Дневник снов', version:2, exportedAt:new Date().toISOString(), dreams };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dream-diary-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  function importDreams(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const imported = Array.isArray(parsed) ? parsed : parsed.dreams;
        if (!Array.isArray(imported)) throw new Error();
        if (!confirm(`Восстановить ${imported.length} записей? Текущие записи будут заменены.`)) return;
        dreams = imported.map(normalizeDream);
        persist(); renderDreams(); renderStats();
        alert('Дневник восстановлен.');
      } catch { alert('Не удалось прочитать резервную копию.'); }
      finally { event.target.value=''; }
    };
    reader.readAsText(file,'utf-8');
  }

  // PDF через системное окно печати. На iPad в нём можно сохранить/поделиться PDF.
  function dreamArticle(d) {
    const field = (name,value) => value ? `<div class="field"><strong>${name}:</strong> ${escapeHtml(value)}</div>` : '';
    return `<article>
      <h2>${escapeHtml(d.title)}</h2>
      <div class="meta">${formatDate(d.date)}</div>
      <div class="field" style="white-space:pre-wrap;margin-top:12px;">${escapeHtml(d.text)}</div>
      ${field('Персонажи',d.characters)}
      ${field('Места',d.places)}
      ${field('Символы / образы',d.symbols)}
      ${field('Эмоции',d.emotions)}
      ${field('Заметки',d.notes)}
    </article>`;
  }

  function printDiary() {
    if (!dreams.length) { alert('В дневнике пока нет записей.'); return; }
    const sorted = [...dreams].sort((a,b) => new Date(b.date)-new Date(a.date));
    const area = document.getElementById('printArea');
    area.innerHTML = `<h1>Дневник снов</h1>${sorted.map(dreamArticle).join('')}`;
    area.style.display='block';
    setTimeout(() => { window.print(); area.style.display='none'; }, 100);
  }

  function printCurrentDream() {
    const id = document.getElementById('dreamId').value;
    const d = dreams.find(x => String(x.id) === String(id));
    if (!d) return;
    const area = document.getElementById('printArea');
    area.innerHTML = `<h1>Дневник снов</h1>${dreamArticle(d)}`;
    area.style.display='block';
    setTimeout(() => { window.print(); area.style.display='none'; }, 100);
  }

  window.onclick = event => {
    const modal = document.getElementById('dreamModal');
    if (event.target === modal) closeModal();
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }

  renderDreams();
</script>
</body>
</html>
