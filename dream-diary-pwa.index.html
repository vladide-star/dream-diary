<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник снов</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Дневник снов">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e9ecef;
            --accent-color: #7b61ff;
            --accent-hover: #9d8aff;
            --danger-color: #ff4d4d;
            --input-bg: #0f3460;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            color: var(--accent-color);
        }

        /* Кнопки */
        .btn-main {
            display: block;
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }

        .btn-main:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Поиск и сортировка */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--input-bg);
            border: 1px solid #2e4a6d;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        /* Список записей */
        .dream-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            border-left: 4px solid var(--accent-color);
            transition: background 0.2s;
        }

        .dream-card:hover {
            background: #1f2d50;
        }

        .dream-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .dream-card .date {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Окно редактора (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group { margin-bottom: 15px; }
        label { font-size: 0.9rem; opacity: 0.8; }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn-save { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-delete { background: var(--danger-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-close { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

    </style>
</head>
<body>

<div class="container">
    <h1>Дневник снов</h1>

    <button class="btn-main" onclick="openModal()">✨ Записать сон</button>

    <div class="backup-actions" style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn-secondary" style="flex:1;" onclick="exportDreams()">Экспорт</button>
        <button class="btn-secondary" style="flex:1;" onclick="document.getElementById('importFile').click()">Импорт</button>
        <input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importDreams(event)">
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Поиск по словам..." oninput="renderDreams()">
        <select id="sortOrder" onchange="renderDreams()" style="background: var(--input-bg); color: white; border-radius: 8px; border: 1px solid #2e4a6d; padding: 5px;">
            <option value="desc">Сначала новые</option>
            <option value="asc">Сначала старые</option>
        </select>
    </div>

    <div id="dreamsList">
        <!-- Записи появятся здесь -->
    </div>
</div>

<!-- Модальное окно для создания/редактирования -->
<div id="dreamModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Новый сон</h2>
        <input type="hidden" id="dreamId">
        
        <div class="form-group">
            <label>Дата</label>
            <input type="date" id="dreamDate">
        </div>
        
        <div class="form-group">
            <label>Название сна</label>
            <input type="text" id="dreamName" placeholder="Что приснилось?">
        </div>

        <div class="form-group">
            <label>Описание сна</label>
            <textarea id="dreamText" rows="5" placeholder="Подробности..."></textarea>
        </div>

        <div class="form-group">
            <label>Эмоции после пробуждения</label>
            <input type="text" id="dreamEmotions" placeholder="Радость, страх, удивление...">
        </div>

        <div class="form-group">
            <label>Дополнительные заметки</label>
            <textarea id="dreamNotes" rows="2" placeholder="Связь с реальностью, символы..."></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn-delete" id="deleteBtn" onclick="deleteDream()" style="display:none;">Удалить</button>
            <div>
                <button class="btn-close" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="saveDream()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let dreams = JSON.parse(localStorage.getItem('myDreams')) || [];

    // Открытие модального окна
    function openModal(id = null) {
        const modal = document.getElementById('dreamModal');
        const deleteBtn = document.getElementById('deleteBtn');
        modal.style.display = 'flex';

        if (id) {
            const dream = dreams.find(d => d.id === id);
            document.getElementById('modalTitle').innerText = 'Редактировать сон';
            document.getElementById('dreamId').value = dream.id;
            document.getElementById('dreamDate').value = dream.date;
            document.getElementById('dreamName').value = dream.title;
            document.getElementById('dreamText').value = dream.text;
            document.getElementById('dreamEmotions').value = dream.emotions;
            document.getElementById('dreamNotes').value = dream.notes;
            deleteBtn.style.display = 'block';
        } else {
            document.getElementById('modalTitle').innerText = 'Новый сон';
            document.getElementById('dreamId').value = '';
            document.getElementById('dreamDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('dreamName').value = '';
            document.getElementById('dreamText').value = '';
            document.getElementById('dreamEmotions').value = '';
            document.getElementById('dreamNotes').value = '';
            deleteBtn.style.display = 'none';
        }
    }

    function closeModal() {
        document.getElementById('dreamModal').style.display = 'none';
    }

    // Сохранение (Создание или Обновление)
    function saveDream() {
        const id = document.getElementById('dreamId').value;
        const dreamData = {
            id: id ? parseInt(id) : Date.now(),
            date: document.getElementById('dreamDate').value,
            title: document.getElementById('dreamName').value || 'Без названия',
            text: document.getElementById('dreamText').value,
            emotions: document.getElementById('dreamEmotions').value,
            notes: document.getElementById('dreamNotes').value
        };

        if (id) {
            const index = dreams.findIndex(d => d.id === parseInt(id));
            dreams[index] = dreamData;
        } else {
            dreams.push(dreamData);
        }

        localStorage.setItem('myDreams', JSON.stringify(dreams));
        closeModal();
        renderDreams();
    }

    // Удаление
    function deleteDream() {
        const id = parseInt(document.getElementById('dreamId').value);
        if (confirm('Удалить эту запись навсегда?')) {
            dreams = dreams.filter(d => d.id !== id);
            localStorage.setItem('myDreams', JSON.stringify(dreams));
            closeModal();
            renderDreams();
        }
    }

    // Отображение списка
    function renderDreams() {
        const listElement = document.getElementById('dreamsList');
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        const sortOrder = document.getElementById('sortOrder').value;

        listElement.innerHTML = '';

        let filteredDreams = dreams.filter(d => 
            d.title.toLowerCase().includes(searchQuery) || 
            d.text.toLowerCase().includes(searchQuery) ||
            d.emotions.toLowerCase().includes(searchQuery) ||
            (d.notes || '').toLowerCase().includes(searchQuery)
        );

        filteredDreams.sort((a, b) => {
            return sortOrder === 'desc' 
                ? new Date(b.date) - new Date(a.date) 
                : new Date(a.date) - new Date(b.date);
        });

        filteredDreams.forEach(dream => {
            const card = document.createElement('div');
            card.className = 'dream-card';
            card.onclick = () => openModal(dream.id);
            card.innerHTML = `
                <div class="date">${new Date(dream.date).toLocaleDateString('ru-RU')}</div>
                <h3>${dream.title}</h3>
                <div style="font-size: 0.9rem; opacity: 0.8;">${dream.text.substring(0, 60)}${dream.text.length > 60 ? '...' : ''}</div>
            `;
            listElement.appendChild(card);
        });

        if (filteredDreams.length === 0) {
            listElement.innerHTML = '<p style="text-align:center; opacity:0.5;">Записей пока нет...</p>';
        }
    }

    // Закрытие при клике вне окна
    window.onclick = function(event) {
        const modal = document.getElementById('dreamModal');
        if (event.target == modal) closeModal();
    }

    // Резервная копия дневника
    function exportDreams() {
        const payload = {
            app: 'Дневник снов',
            version: 1,
            exportedAt: new Date().toISOString(),
            dreams
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dream-diary-backup-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    function importDreams(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                const imported = Array.isArray(parsed) ? parsed : parsed.dreams;
                if (!Array.isArray(imported)) throw new Error('Неверный формат');
                if (!confirm(`Импортировать ${imported.length} записей? Текущие записи будут заменены.`)) return;
                dreams = imported;
                localStorage.setItem('myDreams', JSON.stringify(dreams));
                renderDreams();
                alert('Дневник восстановлен из резервной копии.');
            } catch (e) {
                alert('Не удалось импортировать файл резервной копии.');
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(file, 'utf-8');
    }

    // Регистрация service worker для автономной работы после первого запуска по HTTPS
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        });
    }

    // Инициализация при загрузке
    renderDreams();
</script>

</body>
</html>
